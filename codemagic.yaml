workflows:
  ios-dev-adhoc:
    name: iOS Dev Build (Ad-Hoc 무선 설치)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: appcenter
    environment:
      node: 24
      xcode: latest
      cocoapods: default
      vars:
        APP_VARIANT: "development"
        EXPO_PUBLIC_ROOT_URL: "https://unidorm-test.pages.dev"
        BUNDLE_ID: "com.inuappcenter.unidorm.dev"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: 서브모듈 초기화
        script: |
          git submodule update --init --recursive

      - name: 의존성 설치
        script: |
          npm ci

      - name: 환경 변수 및 포털 URL 설정
        script: |
          echo "EXPO_PUBLIC_ROOT_URL=$EXPO_PUBLIC_ROOT_URL" > .env.local
          rm -rf "$(node -p 'require("os").tmpdir()')"/metro-*

      - name: Expo Prebuild (iOS)
        script: |
          export APP_VARIANT="development"
          npx expo prebuild --clean --platform ios

      - name: 코드 사이닝 설정 (Apple Developer Portal 연동)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: iOS IPA 빌드
        script: |
          xcode-project build-ipa \
            --workspace "ios/*.xcworkspace" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
